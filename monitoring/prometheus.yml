global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "ingestion"
    static_configs:
      - targets: ["ingestion:8000"]

  - job_name: "query-api"
    static_configs:
      - targets: ["query-api:8001"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "kafka"
    static_configs:
      - targets: ["kafka:9092"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]