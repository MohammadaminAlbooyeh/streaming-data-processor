version: "3.9"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: echo stat | nc zookeeper 2181
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server kafka:9092
      interval: 10s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile.ingestion
    ports:
      - "8000:8000"
    environment:
      STREAM_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      STREAM_REDIS_HOST: redis
      STREAM_LOG_LEVEL: INFO
    command: uvicorn ingestion.main:app --host 0.0.0.0 --port 8000
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  query-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8001:8001"
    environment:
      STREAM_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      STREAM_REDIS_HOST: redis
      STREAM_DATABASE_URL: sqlite:///./streaming.db
      STREAM_LOG_LEVEL: INFO
    command: uvicorn api.main:app --host 0.0.0.0 --port 8001
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - streaming-db:/app
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  aggregation-consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    environment:
      STREAM_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      STREAM_REDIS_HOST: redis
      STREAM_LOG_LEVEL: INFO
    command: python -m consumers.aggregation_consumer
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  enrichment-consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    environment:
      STREAM_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      STREAM_REDIS_HOST: redis
      STREAM_LOG_LEVEL: INFO
    command: python -m consumers.enrichment_consumer
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  fraud-consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    environment:
      STREAM_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      STREAM_REDIS_HOST: redis
      STREAM_LOG_LEVEL: INFO
    command: python -m consumers.fraud_consumer
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  storage-consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    environment:
      STREAM_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      STREAM_REDIS_HOST: redis
      STREAM_DATABASE_URL: sqlite:///./streaming.db
      STREAM_LOG_LEVEL: INFO
    command: python -m consumers.storage_consumer
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - streaming-db:/app
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  prometheus:
    image: prom/prometheus:v2.48.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:10.2.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana_dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana_datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
  streaming-db: