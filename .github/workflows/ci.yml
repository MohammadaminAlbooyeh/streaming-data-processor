name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "1.8.2"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run MyPy
        run: mypy core/ ingestion/ consumers/ api/ models/ --ignore-missing-imports

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Start services
        run: |
          docker compose up -d zookeeper kafka redis
          sleep 15

      - name: Run tests
        run: pytest tests/ -v --cov=core --cov=ingestion --cov=consumers --cov=api --cov=models --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ingestion image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.ingestion
          push: false
          tags: streaming-processor/ingestion:latest
          load: true

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: streaming-processor/api:latest
          load: true

      - name: Build consumer image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.consumer
          push: false
          tags: streaming-processor/consumer:latest
          load: true

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start full stack
        run: docker compose up -d

      - name: Wait for services
        run: |
          sleep 30
          curl -f http://localhost:8000/health
          curl -f http://localhost:8001/health

      - name: Run integration test
        run: |
          python -m examples.simulate_traffic --events 100 --rate 10
          sleep 10
          curl -f "http://localhost:8001/events?limit=10"
          curl -f "http://localhost:8001/aggregates?limit=10"
          curl -f "http://localhost:8001/fraud-alerts?limit=10"

      - name: Cleanup
        if: always()
        run: docker compose down -v